<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Stop arguing about what to watch. Swipe, save, and find something you'll actually want to watch.">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CineMatch">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <title>CineMatch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#e11d48', secondary: '#1e293b' },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="text-white">

<div id="app-container">
  <header class="flex-shrink-0 px-5 py-3 flex items-center border-b border-slate-800">
    <i class="fa-solid fa-film text-primary text-xl mr-2"></i>
    <span class="font-extrabold text-lg tracking-tight">CineMatch</span>
    <span id="header-badge" class="ml-auto text-xs font-bold text-slate-500 hidden"></span>
  </header>

  <main id="main" class="relative flex-grow overflow-hidden">
    <!-- screens injected by JS -->
  </main>
</div>

<div id="details-modal">
  <div class="w-full flex justify-center pt-3 pb-1 flex-shrink-0" id="close-details">
    <div class="w-12 h-1.5 bg-slate-600 rounded-full"></div>
  </div>
  <div id="modal-backdrop" class="w-full h-36 bg-slate-900 bg-cover bg-center relative flex-shrink-0"></div>
  <div id="details-content" class="scrollable-content"></div>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-rose-600 text-white text-sm font-semibold px-4 py-2 rounded-full shadow-lg z-[100] hidden"></div>

<button id="btn-install" class="hidden fixed bottom-20 right-4 z-40 bg-primary text-white rounded-full w-12 h-12 shadow-lg items-center justify-center" aria-label="Installa CineMatch" title="Installa CineMatch">
  <i class="fa-solid fa-arrow-down-to-bracket"></i>
</button>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
